<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Éditeur — École du Saint-Enfant-Jésus</title>
  <style>
    #esej-retour{position:fixed;left:14px;bottom:14px;z-index:2147483000;background:#021d51;color:#fff;font:600 13px/1 Montserrat,Arial,sans-serif;padding:10px 14px;border-radius:999px;text-decoration:none;box-shadow:0 2px 10px rgba(0,0,0,.25);opacity:.92}
    #esej-retour:hover{opacity:1}
  </style>
</head>
<body>
  <!-- Widget de connexion Netlify Identity -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <script>
    // Garde-fou : l'éditeur n'est accessible qu'aux comptes validés (rôles admin ou maitre).
    (function () {
      if (!window.netlifyIdentity) return;
      if (netlifyIdentity.setLocale) netlifyIdentity.setLocale('fr');
      function verifier(u) {
        var roles = ((u && u.app_metadata && u.app_metadata.roles) || []).map(function (r) { return String(r).toLowerCase(); });
        var ok = roles.indexOf('admin') >= 0 || roles.indexOf('maitre') >= 0;
        if (!u || !ok) location.replace('./' + (u ? '#attente' : ''));
      }
      // L'utilisateur courant n'est connu qu'après l'initialisation du widget
      netlifyIdentity.on('init', verifier);
      netlifyIdentity.on('logout', function () { location.replace('./'); });
    })();
  </script>
  <script>
    // Partage de l'écran à l'ouverture : 30 % pour le formulaire (gauche), 70 % pour l'aperçu (droite).
    // La poignée centrale reste utilisable pour ajuster ponctuellement.
    try {
      localStorage.setItem('cms.split-pane-position', String(Math.round(window.innerWidth * 0.3)));
      localStorage.setItem('cms.preview-visible', 'true');
    } catch (e) { /* stockage indisponible : partage par défaut */ }
  </script>
  <!-- Decap CMS (version figée : l'aperçu modifiable s'appuie sur sa structure interne) -->
  <script src="https://unpkg.com/decap-cms@3.16.2/dist/decap-cms.js"></script>
  <!-- Aperçu en direct : rendu de la page avec les gabarits et le style du site -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/turndown@7.2.0/dist/turndown.js"></script>
  <script src="apercu.js"></script>
  <script>
    // L'aperçu est rendu à la largeur d'une fenêtre de navigateur complète, puis réduit à l'échelle
    // pour tenir dans son volet : ce qu'on voit est exactement la page en plein écran, en plus petit.
    (function () {
      var LARGEUR_PAGE = Math.max(1200, window.innerWidth);
      function ajuster() {
        var fr = document.querySelector('.Pane2 iframe');
        var volet = fr && fr.closest('.Pane2');
        if (!fr || !volet) return;
        // le volet ne doit jamais s'étirer pour suivre l'iframe agrandie
        volet.style.minWidth = '0'; volet.style.overflow = 'hidden';
        var conteneur = fr.parentElement;
        conteneur.style.overflow = 'hidden'; conteneur.style.width = '100%'; conteneur.style.position = 'relative';
        var r = volet.getBoundingClientRect();
        if (r.width < 50 || r.height < 50) return;
        var k = r.width / LARGEUR_PAGE;
        fr.style.position = 'absolute'; fr.style.left = '0'; fr.style.top = '0';
        fr.style.width = LARGEUR_PAGE + 'px';
        fr.style.height = Math.round(conteneur.getBoundingClientRect().height / k) + 'px';
        fr.style.transform = 'scale(' + k + ')';
        fr.style.transformOrigin = '0 0';
        fr.style.maxWidth = 'none';
        // si un ancêtre a défilé horizontalement (focus dans l'aperçu), on le remet en place
        var sp = document.querySelector('.SplitPane'); if (sp && sp.scrollLeft) sp.scrollLeft = 0;
      }
      var obs = new ResizeObserver(ajuster);
      var branche = null;
      new MutationObserver(function () {
        var fr = document.querySelector('.Pane2 iframe');
        var volet = fr && fr.closest('.Pane2');
        if (volet && volet !== branche) { branche = volet; obs.observe(volet); ajuster(); }
      }).observe(document.documentElement, { childList: true, subtree: true });
      window.addEventListener('resize', ajuster);
      document.addEventListener('scroll', function (e) { if (e.target && e.target.classList && e.target.classList.contains('SplitPane') && e.target.scrollLeft) e.target.scrollLeft = 0; }, true);
      ajuster();
    })();
  </script>
  <a id="esej-retour" href="./">← Tableau de bord</a>
  <script>
    // Navigation : l'éditeur ne sert qu'à modifier une page ou un réglage. Ses écrans de liste
    // (« collections ») ramènent au tableau de bord, sauf si on les demande explicitement (cms.html?liste).
    (function () {
      var modeMedia = /[?&]media/.test(location.search), modeListe = /[?&]liste/.test(location.search);
      function estUneListe(h) { return h === '' || h === '#' || h === '#/' || h === '#/collections' || /^#\/collections\/[^/]+\/?$/.test(h) || /^#\/search\//.test(h); }
      function verif() { if (!modeMedia && !modeListe && estUneListe(location.hash)) location.replace('./'); }
      window.addEventListener('hashchange', verif);
      verif();

      // Libellé français du bouton de connexion ; ouverture directe de la médiathèque (cms.html?media),
      // puis retour au tableau de bord quand on la referme.
      var LABEL = 'Se connecter au compte Administrateur';
      var mediaOuverte = false, dernierClic = 0;
      function tick() {
        document.querySelectorAll('button').forEach(function (b) {
          var t = (b.textContent || '').trim();
          if (/netlify identity/i.test(t) && t !== LABEL) b.textContent = LABEL;
          if (modeMedia && !mediaOuverte && /^(m[ée]dia|media)s?$/i.test(t) && Date.now() - dernierClic > 1500) { dernierClic = Date.now(); b.click(); }
        });
        if (modeMedia) {
          var modale = document.querySelector('.ReactModal__Overlay, .ReactModal__Content, [role="dialog"]');
          if (modale) mediaOuverte = true;
          else if (mediaOuverte) location.replace('./');
        }
      }
      new MutationObserver(tick).observe(document.documentElement, { childList: true, subtree: true });
      tick();
    })();
  </script>
</body>
</html>
